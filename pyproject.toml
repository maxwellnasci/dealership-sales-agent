[project]
name = "dealership-sales-agent"
version = "0.1.0"
description = "Agente de vendas para revendas de veículos construído com LangGraph — StateGraph, checkpointing por lead (WhatsApp), human-in-the-loop, tool calling com retry e guardrails anti-alucinação com Pydantic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",  # fila durável do agendador de cards (scheduler/store.py)
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "langfuse>=3.0",
    # mxos_ldm (nó predict_lead_scoring do grafo)
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pytest-cov>=5.0",
]
# Backend XGBoost do mxos_ldm (sem ele, `auto` cai no scikit-learn).
ldm = [
    "xgboost>=2.1",
]
# Backend opcional do mxos_ldm (puxa torch; não entra no CI).
tabpfn = [
    "tabpfn>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealership_agent", "src/mxos_ldm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Só testes em função; evita coletar modelos como TestDriveSlot (prefixo "Test").
python_classes = []

[tool.coverage.run]
source = ["dealership_agent", "mxos_ldm"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
