[project]
name = "dealership-sales-agent"
version = "0.1.0"
description = "Agente de vendas para revendas de veículos construído com LangGraph — StateGraph, checkpointing por lead (WhatsApp), human-in-the-loop, tool calling com retry e guardrails anti-alucinação com Pydantic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langfuse>=2.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealership_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
